<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>모두의 의견공유 - 실시간 참여</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- Canvas Confetti -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.2/dist/confetti.browser.min.js"></script>
  
  <link rel="stylesheet" href="assets/css/custom.css">
</head>
<body class="gradient-bg text-slate-100 min-h-screen flex flex-col justify-between selection:bg-indigo-500 selection:text-white">

  <!-- Header -->
  <header class="w-full border-b border-slate-800/80 backdrop-blur-md bg-slate-900/60 sticky top-0 z-40 px-4 py-3.5">
    <div class="max-w-2xl mx-auto flex items-center justify-between">
      <div class="flex items-center space-x-2.5">
        <div class="w-8 h-8 rounded-xl bg-gradient-to-tr from-indigo-500 to-cyan-400 flex items-center justify-center shadow-lg shadow-indigo-500/30">
          <i data-lucide="sparkles" class="w-4 h-4 text-white"></i>
        </div>
        <span class="font-extrabold text-base tracking-tight bg-gradient-to-r from-white via-slate-200 to-indigo-200 bg-clip-text text-transparent">
          모두의 의견공유
        </span>
      </div>

      <div class="flex items-center space-x-2">
        <span id="firebase-status-badge" class="flex items-center text-[11px] font-semibold px-2 py-0.5 rounded-full bg-slate-800 text-slate-400 border border-slate-700">
          <span class="w-1.5 h-1.5 rounded-full bg-slate-500 mr-1"></span> 확인 중
        </span>
        <a href="presenter.html" class="flex items-center text-xs font-semibold px-3 py-1.5 rounded-lg bg-indigo-600/30 text-indigo-300 border border-indigo-500/40 hover:bg-indigo-600 hover:text-white transition-all shadow-sm">
          <i data-lucide="presentation" class="w-3.5 h-3.5 mr-1.5"></i>
          강사용 화면
        </a>
      </div>
    </div>
  </header>

  <!-- Main Content Wrapper -->
  <main class="flex-1 max-w-xl w-full mx-auto p-4 sm:p-6 flex flex-col justify-center">

    <!-- Screen 1: 코드 입력 화면 -->
    <div id="screen-enter" class="glass-panel dark rounded-3xl p-6 sm:p-8 shadow-2xl border border-slate-700/60 transition-all">
      <div class="text-center mb-6">
        <div class="w-16 h-16 mx-auto mb-4 rounded-2xl bg-indigo-500/20 text-indigo-400 flex items-center justify-center border border-indigo-500/30">
          <i data-lucide="key-round" class="w-8 h-8"></i>
        </div>
        <h1 class="text-2xl font-bold text-white mb-2">연수 방 참여하기</h1>
        <p class="text-slate-400 text-sm">강사 화면에 안내된 6자리 코드를 입력해주세요.</p>
      </div>

      <div class="space-y-4">
        <div>
          <label for="input-room-code" class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-2 text-center">
            입장 코드 (6자리)
          </label>
          <input 
            type="text" 
            id="input-room-code" 
            maxlength="6" 
            placeholder="예: 7A9K2M" 
            class="w-full text-center text-3xl font-extrabold tracking-widest uppercase bg-slate-900/90 border-2 border-slate-700 rounded-2xl py-3.5 px-4 text-indigo-300 placeholder-slate-600 focus:outline-none focus:border-indigo-500 focus:ring-4 focus:ring-indigo-500/20 transition-all font-mono"
            autocomplete="off"
            autofocus
          >
        </div>

        <button 
          id="btn-join" 
          class="w-full py-4 rounded-2xl font-bold text-base bg-gradient-to-r from-indigo-500 to-cyan-500 hover:from-indigo-600 hover:to-cyan-600 text-white shadow-xl shadow-indigo-500/25 active:scale-[0.98] transition-all flex items-center justify-center space-x-2">
          <span>입장하기</span>
          <i data-lucide="arrow-right" class="w-5 h-5"></i>
        </button>
      </div>

      <div class="mt-6 pt-6 border-t border-slate-800 text-center text-xs text-slate-500">
        QR 코드로 접속하셨다면 잠시만 기다려주세요...
      </div>
    </div>

    <!-- Screen 2: 질문 확인 및 의견/투표 제출 폼 -->
    <div id="screen-form" class="hidden glass-panel dark rounded-3xl p-6 sm:p-8 shadow-2xl border border-slate-700/60 transition-all">
      <!-- 상단 질문 단계 및 방 코드 -->
      <div class="flex items-center justify-between mb-4">
        <div class="flex items-center space-x-2">
          <span id="badge-question-step" class="inline-flex items-center px-3 py-1 rounded-full text-xs font-bold bg-indigo-500/20 text-indigo-300 border border-indigo-500/30">
            Q 1 / 1
          </span>
          <span id="badge-question-type" class="text-[11px] font-semibold text-cyan-400 bg-cyan-950/60 border border-cyan-800/60 px-2.5 py-0.5 rounded-full">
            주관식
          </span>
        </div>
        <span class="text-xs font-mono font-bold text-slate-400 bg-slate-800 px-2.5 py-1 rounded-lg">
          CODE: <span id="badge-room-code" class="text-indigo-400">------</span>
        </span>
      </div>

      <!-- 질문 타이틀 배너 -->
      <div class="bg-gradient-to-br from-indigo-950/60 to-slate-900/80 p-5 rounded-2xl border border-indigo-500/30 mb-6">
        <span class="text-xs font-bold text-indigo-400 flex items-center mb-1.5">
          <i data-lucide="help-circle" class="w-4 h-4 mr-1"></i> 현재 질문
        </span>
        <h2 id="current-question-text" class="text-lg sm:text-xl font-bold text-white leading-snug">
          질문을 불러오는 중입니다...
        </h2>
      </div>

      <!-- 응답 제출 폼 -->
      <form id="form-response" class="space-y-5">
        <!-- 닉네임 입력 (공통) -->
        <div>
          <label for="input-nickname" class="block text-xs font-semibold text-slate-300 mb-1.5">
            작성자 / 닉네임 (선택)
          </label>
          <input 
            type="text" 
            id="input-nickname" 
            maxlength="20" 
            placeholder="비워두시면 '익명'으로 제출됩니다" 
            class="w-full bg-slate-900/80 border border-slate-700 rounded-xl py-2.5 px-3.5 text-sm text-slate-200 placeholder-slate-500 focus:outline-none focus:border-indigo-500 transition-all"
          >
        </div>

        <!-- 1) 주관식 서술형 입력창 (Type === 'text') -->
        <div id="container-text-input">
          <div class="flex items-center justify-between mb-1.5">
            <label for="text-response" class="block text-xs font-semibold text-slate-300">
              나의 의견 <span class="text-indigo-400">*</span>
            </label>
            <span id="char-counter" class="text-xs text-slate-500 font-mono">0/500</span>
          </div>
          <textarea 
            id="text-response" 
            rows="5" 
            maxlength="500" 
            placeholder="연수 내용에 대한 의견, 소감, 적용 아이디어를 자유롭게 남겨주세요." 
            class="w-full bg-slate-900/80 border border-slate-700 rounded-2xl p-4 text-base text-slate-100 placeholder-slate-500 focus:outline-none focus:border-indigo-500 focus:ring-4 focus:ring-indigo-500/20 transition-all resize-none leading-relaxed"
          ></textarea>
        </div>

        <!-- 2) 선택형 투표 보기 리스트 (Type === 'choice') -->
        <div id="container-choice-input" class="hidden">
          <label class="block text-xs font-semibold text-slate-300 mb-2">
            보기 선택 <span class="text-cyan-400">*</span>
          </label>
          <div id="options-button-list" class="space-y-2.5">
            <!-- 동적 보기 버튼 생성 -->
          </div>
        </div>

        <button 
          type="submit" 
          id="btn-submit" 
          class="w-full py-4 rounded-2xl font-bold text-base bg-gradient-to-r from-indigo-500 to-cyan-500 hover:from-indigo-600 hover:to-cyan-600 text-white shadow-xl shadow-indigo-500/25 active:scale-[0.98] transition-all flex items-center justify-center space-x-2">
          <span>제출하기</span>
          <i data-lucide="send" class="w-4 h-4 ml-1"></i>
        </button>
      </form>
    </div>

    <!-- Screen 3: 제출 성공 및 다음 질문 대기 화면 -->
    <div id="screen-success" class="hidden glass-panel dark rounded-3xl p-8 shadow-2xl border border-slate-700/60 text-center transition-all">
      <div class="w-20 h-20 mx-auto mb-5 rounded-full bg-emerald-500/20 text-emerald-400 flex items-center justify-center border-2 border-emerald-500/40 shadow-lg shadow-emerald-500/20 animate-bounce">
        <i data-lucide="check" class="w-10 h-10 stroke-[2.5]"></i>
      </div>

      <h2 class="text-2xl font-bold text-white mb-2">응답이 성공적으로 등록되었습니다!</h2>
      <p class="text-slate-300 text-sm leading-relaxed mb-6">
        강사님의 프리젠테이션 대화면을 주목해주세요.<br>
        실시간 결과가 카드 및 시각화로 함께 공유됩니다.
      </p>

      <!-- 다음 질문 대기 안내 배너 -->
      <div class="bg-indigo-950/60 border border-indigo-500/30 rounded-2xl p-4 flex items-center justify-center space-x-3 text-indigo-200 text-xs sm:text-sm">
        <span class="w-3 h-3 rounded-full bg-cyan-400 animate-ping"></span>
        <span>강사님이 <strong>다음 질문</strong>을 시작하면 자동으로 화면이 바뀝니다.</span>
      </div>

      <button 
        id="btn-submit-another" 
        class="mt-6 w-full py-3.5 rounded-2xl font-semibold text-sm bg-slate-800 hover:bg-slate-700 text-slate-300 border border-slate-700 transition-all flex items-center justify-center space-x-2">
        <i data-lucide="edit-3" class="w-4 h-4"></i>
        <span>응답 수정 / 추가 작성하기</span>
      </button>
    </div>

  </main>

  <!-- Footer -->
  <footer class="py-4 text-center text-xs text-slate-500">
    <p>ⓒ 2026. 창순기획 Co. All rights reserved.</p>
  </footer>

  <script type="module" src="assets/js/participant-app.js"></script>
</body>
</html>
